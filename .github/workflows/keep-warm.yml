name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"   # Render free tier sleeps after 15 idle minutes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: ${{ secrets.API_URL }}
    steps:
      - run: |
          if [ -z "$API_URL" ]; then echo "::warning::API_URL secret not set"; exit 0; fi
          curl -fsS --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors "$API_URL/api/health"
